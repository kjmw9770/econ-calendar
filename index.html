<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>경제 발표 캘린더</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="경제캘린더">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg:#0d1117;--s1:#161b22;--s2:#1c2128;--bd:#30363d;--bd2:#484f58;
  --tx:#e6edf3;--tx2:#8b949e;--tx3:#6e7681;
  --fed:#388bfd;--fed-bg:#0d2444;
  --bok:#3fb950;--bok-bg:#0d2d0d;
  --data:#d29922;--data-bg:#2d1e00;
  --red:#f85149;--red-bg:#3d0c0c;
  --amb:#d29922;--amb-bg:#2d1e00;
  --grn:#3fb950;--pur:#bc8cff;--pur-bg:#2a1a4a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx)}

.header{background:var(--s1);border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top,0) 1.25rem 0;padding-top:calc(env(safe-area-inset-top,0) + 14px);padding-bottom:12px;position:fixed;top:0;left:0;right:0;z-index:100}
.h-row{display:flex;align-items:center;justify-content:space-between}
.h-title{font-size:17px;font-weight:600}
.h-right{display:flex;align-items:center;gap:6px}
.update-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer}
.update-btn:active{background:var(--s2)}
.update-chip{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--fed-bg);color:var(--fed);border:1px solid #1f3a6e}
.news-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--bd2);background:transparent;color:var(--pur);cursor:pointer}
.news-btn:active{background:var(--pur-bg)}
.h-sub{font-size:12px;color:var(--tx3);margin-top:3px}

.main{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.content{padding-bottom:env(safe-area-inset-bottom,0)}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:1rem 1.25rem 0}
.sum-card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
.sum-lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
.sum-val{font-size:18px;font-weight:600;margin-top:1px}
.sum-sub{font-size:10px;color:var(--tx2);margin-top:1px;line-height:1.3}

.filters{display:flex;gap:6px;padding:.85rem 1.25rem 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:all .15s}
.fbtn.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:500}

/* 탭 전환 */
.tabs{display:flex;gap:0;padding:.85rem 1.25rem 0;border-bottom:1px solid var(--bd);margin:0 0 0}
.tab{font-size:13px;padding:6px 16px;border:none;background:transparent;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--tx);border-bottom-color:var(--fed);font-weight:500}

.body{padding:0 1.25rem;max-width:680px;margin:0 auto}
.month-sep{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .45rem;display:flex;align-items:center;gap:8px}
.month-sep::after{content:'';flex:1;height:1px;background:var(--bd)}

.ev{background:var(--s2);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;overflow:hidden}
.ev.done{opacity:.5}
.ev-top{display:flex;align-items:flex-start;gap:10px;padding:11px 13px 10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.ev-date{font-size:12px;color:var(--tx3);min-width:30px;padding-top:1px;font-variant-numeric:tabular-nums}
.ev-body{flex:1;min-width:0}
.ev-name{font-size:14px;font-weight:500;color:var(--tx)}
.ev-detail{font-size:11px;color:var(--tx2);margin-top:2px;line-height:1.4}
.badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500;white-space:nowrap}
.b-fed{background:var(--fed-bg);color:var(--fed);border:1px solid #1f3a6e}
.b-bok{background:var(--bok-bg);color:var(--bok);border:1px solid #1a3d1a}
.b-data{background:var(--data-bg);color:var(--data);border:1px solid #3d2d00}
.b-hi{background:var(--red-bg);color:var(--red);border:1px solid #5c1a1a}
.b-med{background:var(--amb-bg);color:var(--amb);border:1px solid #3d2d00}
.b-done{background:#161b22;color:var(--tx3);border:1px solid var(--bd)}
.b-day{border-radius:20px;font-size:10px;padding:2px 7px;font-weight:600;white-space:nowrap}
.b-urgent{background:var(--red-bg);color:var(--red);border:1px solid #5c1a1a}
.b-soon{background:var(--amb-bg);color:var(--amb);border:1px solid #3d2d00}
.b-normal{background:var(--fed-bg);color:var(--fed);border:1px solid #1f3a6e}

/* 결과/컨센서스 pill */
.result-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;background:#0d2d0d;color:var(--grn);border:1px solid #1a3d1a;margin-top:5px;line-height:1.4;max-width:100%}
.consensus-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--pur-bg);color:var(--pur);border:1px solid #3d2560;margin-top:4px;line-height:1.4;max-width:100%}
.pill-label{font-size:10px;opacity:.7;flex-shrink:0}

.memo-prev{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 7px;border-radius:6px;background:var(--s1);color:var(--tx2);border:1px solid var(--bd);margin-top:4px;max-width:100%;overflow:hidden}
.memo-prev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{font-size:18px;color:var(--tx3);transition:transform .2s;line-height:1;flex-shrink:0}
.chev.open{transform:rotate(180deg)}

.memo-panel{display:none;border-top:1px solid var(--bd);padding:11px 13px 13px}
.memo-panel.open{display:block}
.memo-lbl{font-size:11px;color:var(--tx3);margin-bottom:5px}
.memo-ta{width:100%;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd2);background:var(--s1);color:var(--tx);resize:none;font-family:inherit;line-height:1.6;min-height:70px;outline:none}
.memo-ta::placeholder{color:var(--tx3)}
.memo-ta:focus{border-color:var(--fed)}
.memo-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.memo-hint{font-size:11px;color:var(--tx3)}
.memo-btn{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer}
.memo-btn:active{background:var(--s1)}
.saved-msg{font-size:11px;color:var(--grn);display:none}

/* 뉴스 탭 */
.news-section{padding:0 1.25rem;max-width:680px;margin:0 auto}
.news-loading{text-align:center;padding:2rem 1rem;color:var(--tx3);font-size:14px}
.news-card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;padding:12px 14px;cursor:pointer;text-decoration:none;display:block}
.news-card:active{background:var(--s1)}
.news-src{font-size:10px;color:var(--pur);margin-bottom:4px}
.news-title{font-size:13px;font-weight:500;color:var(--tx);line-height:1.45}
.news-time{font-size:10px;color:var(--tx3);margin-top:5px}
.news-error{margin:1rem 0;padding:12px;background:var(--red-bg);border:1px solid #5c1a1a;border-radius:10px;font-size:13px;color:var(--red)}
.news-refresh{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer;margin:8px 0 0}

.loading{text-align:center;padding:3rem 1rem;color:var(--tx3);font-size:14px}
.error-box{margin:1rem 1.25rem;padding:12px;background:var(--red-bg);border:1px solid #5c1a1a;border-radius:10px;font-size:13px;color:var(--red)}
.spacer{height:72px}

/* 뷰 전환 */
#view-cal{display:block}
#view-news{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="h-row">
    <div class="h-title">📅 경제 발표 캘린더</div>
    <div class="h-right">
      <span class="update-chip" id="ver-chip">로딩중...</span>
      <button class="update-btn" id="refresh-btn" onclick="onRefresh()">↻ 새로고침</button>
    </div>
  </div>
  <div class="h-sub">미국 연준 · 한국 금통위 · 주요 경제지표</div>
</div>

<div class="main" id="main">
  <div class="spacer"></div>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-lbl">다음 이벤트</div>
      <div class="sum-val" id="s-date" style="color:var(--fed);font-size:15px">—</div>
      <div class="sum-sub" id="s-name">로딩중</div>
    </div>
    <div class="sum-card">
      <div class="sum-lbl">D-day</div>
      <div class="sum-val" id="s-d" style="color:var(--red)">—</div>
      <div class="sum-sub">다음 주요일정</div>
    </div>
    <div class="sum-card">
      <div class="sum-lbl">다음 FOMC</div>
      <div class="sum-val" id="s-fomc" style="color:var(--amb);font-size:15px">—</div>
      <div class="sum-sub">한국시간 새벽 3시</div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab on" onclick="switchTab('cal',this)">📅 캘린더</button>
    <button class="tab" onclick="switchTab('news',this)">📰 정책·주식 뉴스</button>
  </div>

  <!-- 캘린더 뷰 -->
  <div id="view-cal">
    <div class="filters">
      <button class="fbtn on" onclick="setF('all',this)">전체</button>
      <button class="fbtn" onclick="setF('fed',this)">🇺🇸 미국 연준</button>
      <button class="fbtn" onclick="setF('bok',this)">🇰🇷 한국 금통위</button>
      <button class="fbtn" onclick="setF('data',this)">📊 경제지표</button>
      <button class="fbtn" onclick="setF('hi',this)">🔴 HIGH만</button>
    </div>
    <div class="body" id="body">
      <div class="loading">📡 이벤트 데이터 불러오는 중...</div>
    </div>
  </div>

  <!-- 뉴스 뷰 -->
  <div id="view-news">
    <div class="news-section" id="news-body">
      <div class="news-loading">뉴스 탭을 누르면 로드됩니다</div>
    </div>
  </div>

  <div class="content"></div>
</div>

<script>
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let EVENTS = [];
let memos = {};
let openIds = {};
let filt = 'all';
let newsLoaded = false;
let currentTab = 'cal';

function loadMemos() {
  try { memos = JSON.parse(localStorage.getItem('econ_cal_memos') || '{}'); } catch(e) { memos = {}; }
}
function saveMemo(id, text) {
  memos[id] = text;
  localStorage.setItem('econ_cal_memos', JSON.stringify(memos));
}

function onRefresh() {
  if (currentTab === 'cal') loadEvents(true);
  else { newsLoaded = false; loadNews(); }
}

async function loadEvents(force = false) {
  try {
    const url = './events.json?' + (force ? Date.now() : 'v=1');
    const res = await fetch(url, { cache: force ? 'no-store' : 'default' });
    const data = await res.json();
    EVENTS = data.events || [];
    const ver = data.version || '';
    document.getElementById('ver-chip').textContent = ver ? ver.slice(5) + ' 업데이트' : '최신';
    updateSummary();
    render();
  } catch(e) {
    document.getElementById('body').innerHTML = `<div class="error-box">⚠️ 데이터를 불러올 수 없습니다.<br><small>${e.message}</small></div>`;
  }
}

function ddays(str) {
  const d = new Date(str); d.setHours(0,0,0,0);
  return Math.round((d - TODAY) / 86400000);
}
function fmtDate(str) {
  const d = new Date(str);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function fmtMonth(str) {
  const d = new Date(str);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월`;
}

function dBadge(ev) {
  if (ev.done || ddays(ev.date) < 0) return `<span class="badge b-done">완료</span>`;
  const d = ddays(ev.date);
  if (d === 0) return `<span class="badge b-day b-urgent">D-day</span>`;
  if (d <= 7)  return `<span class="badge b-day b-urgent">D-${d}</span>`;
  if (d <= 21) return `<span class="badge b-day b-soon">D-${d}</span>`;
  return `<span class="badge b-day b-normal">D-${d}</span>`;
}
function catBadge(cat) {
  if (cat==='fed') return `<span class="badge b-fed">🇺🇸 미국 연준</span>`;
  if (cat==='bok') return `<span class="badge b-bok">🇰🇷 한국 금통위</span>`;
  return `<span class="badge b-data">📊 경제지표</span>`;
}

function render() {
  let filtered = EVENTS;
  if (filt==='fed')  filtered = EVENTS.filter(e=>e.cat==='fed');
  else if (filt==='bok')  filtered = EVENTS.filter(e=>e.cat==='bok');
  else if (filt==='data') filtered = EVENTS.filter(e=>e.cat==='data');
  else if (filt==='hi')   filtered = EVENTS.filter(e=>e.impact==='hi');

  if (!filtered.length) {
    document.getElementById('body').innerHTML = `<div class="loading">해당 조건의 이벤트가 없습니다.</div>`;
    return;
  }

  let html = ''; let lastM = '';
  filtered.forEach(ev => {
    const m = fmtMonth(ev.date);
    if (m !== lastM) { html += `<div class="month-sep">${m}</div>`; lastM = m; }
    const isOpen = !!openIds[ev.id];
    const memo = memos[ev.id] || '';
    const imp = ev.impact==='hi'
      ? `<span class="badge b-hi">🔴 HIGH</span>`
      : `<span class="badge b-med">🟡 MED</span>`;

    // 결과 pill (완료된 경우)
    let resultHtml = '';
    if (ev.result) {
      resultHtml = `<div class="result-pill"><span class="pill-label">결과</span> ✅ ${ev.result}</div>`;
    }

    // 컨센서스 pill (미완료 + consensus 있는 경우)
    let consensusHtml = '';
    if (!ev.done && ev.consensus) {
      consensusHtml = `<div class="consensus-pill"><span class="pill-label">예상</span> 📊 ${ev.consensus}</div>`;
    }

    // 메모 미리보기
    const memoPrev = memo
      ? `<div class="memo-prev">📝 <span>${memo.length>30?memo.slice(0,30)+'…':memo}</span></div>`
      : '';

    html += `
    <div class="ev${ev.done?' done':''}" id="ev-${ev.id}">
      <div class="ev-top" onclick="toggle('${ev.id}')">
        <div class="ev-date">${fmtDate(ev.date)}</div>
        <div class="ev-body">
          <div class="ev-name">${ev.name}</div>
          <div class="ev-detail">${ev.detail}</div>
          <div class="badges">${catBadge(ev.cat)}${imp}${dBadge(ev)}</div>
          ${resultHtml}${consensusHtml}${memoPrev}
        </div>
        <div class="chev${isOpen?' open':''}">›</div>
      </div>
      <div class="memo-panel${isOpen?' open':''}" id="mp-${ev.id}">
        <div class="memo-lbl">📝 내 메모</div>
        <textarea class="memo-ta" id="ta-${ev.id}" placeholder="투자 판단, 예상 시나리오...">${memo}</textarea>
        <div class="memo-footer">
          <span class="saved-msg" id="sm-${ev.id}">✅ 저장됨</span>
          <button class="memo-btn" onclick="doSave('${ev.id}')">💾 저장</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('body').innerHTML = html;
}

function toggle(id) {
  openIds[id] = !openIds[id];
  render();
  if (openIds[id]) setTimeout(()=>{ const ta=document.getElementById('ta-'+id); if(ta) ta.focus(); }, 50);
}
function doSave(id) {
  const ta = document.getElementById('ta-'+id);
  if (!ta) return;
  saveMemo(id, ta.value);
  const sm = document.getElementById('sm-'+id);
  if (sm) { sm.style.display='inline'; setTimeout(()=>{ sm.style.display='none'; }, 1500); }
  render(); openIds[id] = true;
}
function setF(f, btn) {
  filt = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function updateSummary() {
  const upcoming = EVENTS.filter(e => !e.done && ddays(e.date) >= 0);
  const fomcList = EVENTS.filter(e => e.cat==='fed' && !e.done && ddays(e.date) >= 0);
  if (upcoming.length) {
    const next = upcoming[0];
    const d = ddays(next.date);
    document.getElementById('s-date').textContent = fmtDate(next.date);
    document.getElementById('s-name').textContent = next.name.length > 10 ? next.name.slice(0,10)+'…' : next.name;
    const dEl = document.getElementById('s-d');
    dEl.textContent = d===0 ? 'D-day' : `D-${d}`;
    dEl.style.color = d<=7 ? 'var(--red)' : d<=21 ? 'var(--amb)' : 'var(--fed)';
  }
  if (fomcList.length) {
    document.getElementById('s-fomc').textContent = fmtDate(fomcList[0].date);
  }
}

/* ===== 뉴스 탭 ===== */
const NEWS_FEEDS = [
  {
    label: '연합뉴스 경제',
    url: 'https://api.rss2json.com/v1/api.json?rss_url=https://www.yonhapnews.co.kr/rss/economy.xml&count=8'
  },
  {
    label: '한국경제 증권',
    url: 'https://api.rss2json.com/v1/api.json?rss_url=https://www.hankyung.com/feed/securities&count=8'
  }
];

const NEWS_KEYWORDS = ['금리','기준금리','주식','코스피','코스닥','증시','FOMC','연준','한국은행','금통위','공매도','외국인','기관','ETF','상장','IPO','정책','규제','세금','배당','자사주','투자','환율','달러'];

function matchesKeyword(title) {
  return NEWS_KEYWORDS.some(kw => title.includes(kw));
}

function relTime(pubDate) {
  if (!pubDate) return '';
  try {
    const d = new Date(pubDate);
    const diff = Math.floor((Date.now() - d) / 60000);
    if (diff < 1) return '방금';
    if (diff < 60) return `${diff}분 전`;
    if (diff < 1440) return `${Math.floor(diff/60)}시간 전`;
    return `${Math.floor(diff/1440)}일 전`;
  } catch { return ''; }
}

async function loadNews() {
  if (newsLoaded) return;
  const nb = document.getElementById('news-body');
  nb.innerHTML = '<div class="news-loading">📡 뉴스 가져오는 중...</div>';

  let allItems = [];
  let hasError = false;

  await Promise.all(NEWS_FEEDS.map(async feed => {
    try {
      const res = await fetch(feed.url);
      const data = await res.json();
      if (data.status === 'ok' && data.items) {
        data.items.forEach(item => {
          allItems.push({ ...item, _src: feed.label });
        });
      }
    } catch(e) {
      hasError = true;
    }
  }));

  // 키워드 필터 + 중복 제거 + 최신순 정렬
  const seen = new Set();
  let filtered = allItems
    .filter(item => {
      const title = item.title || '';
      if (seen.has(title)) return false;
      seen.add(title);
      return matchesKeyword(title);
    })
    .sort((a, b) => new Date(b.pubDate||0) - new Date(a.pubDate||0))
    .slice(0, 30);

  if (filtered.length === 0) {
    nb.innerHTML = `
      <div class="news-error">
        ${hasError ? '⚠️ 일부 피드를 불러오지 못했습니다.<br>' : ''}
        키워드 관련 뉴스가 없습니다.
        <br><button class="news-refresh" onclick="newsLoaded=false;loadNews()">다시 시도</button>
      </div>`;
    return;
  }

  let html = '';
  if (hasError) {
    html += `<div style="font-size:11px;color:var(--amb);padding:6px 0 2px">⚠️ 일부 뉴스 소스를 불러오지 못했습니다</div>`;
  }

  filtered.forEach(item => {
    const title = (item.title || '').replace(/</g, '&lt;');
    const link  = item.link || '#';
    const src   = item._src;
    const time  = relTime(item.pubDate);
    html += `
    <a class="news-card" href="${link}" target="_blank" rel="noopener">
      <div class="news-src">${src}</div>
      <div class="news-title">${title}</div>
      <div class="news-time">${time}</div>
    </a>`;
  });

  nb.innerHTML = html;
  newsLoaded = true;
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('view-cal').style.display  = tab === 'cal'  ? 'block' : 'none';
  document.getElementById('view-news').style.display = tab === 'news' ? 'block' : 'none';
  if (tab === 'news') loadNews();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

loadMemos();
loadEvents();
</script>
</body>
</html>
